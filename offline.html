<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Find My Device</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: #0b0b0c;
            color: #ececee;
            text-align: center;
        }

        main {
            max-width: 340px;
        }

        .spin {
            width: 38px;
            height: 38px;
            margin: 0 auto 18px;
            border-radius: 50%;
            border: 4px solid #2e2e33;
            border-top-color: #c7c7cd;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 1.3rem;
            margin: 0 0 8px;
        }

        p {
            color: #9a9aa1;
            line-height: 1.5;
            margin: 0 0 18px;
        }

        button {
            font: inherit;
            font-weight: 700;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            color: #0b0b0c;
            background: #ececee;
            border: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .spin {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="spin" aria-hidden="true"></div>
        <h1>Can't reach the server</h1>
        <p>Check your internet connection. Find My Device keeps trying every few seconds and will open by itself when
            you are back online.</p>
        <button id="retry">Try now</button>
    </main>
    <script>
        document.getElementById('retry').addEventListener('click', function () {
            if (window.fmdDesktop) window.fmdDesktop.retry();
        });
    </script>
</body>

</html>
